name: Market News Bot

on:
  schedule:
    - cron: '*/15 * * * *'    # every 15 min, 24/7 -> breaking alerts only
    - cron: '30 2 * * 1-5'    # 08:00 IST weekdays -> pre-market brief
    - cron: '0 11 * * 1-5'    # 16:30 IST weekdays -> Indian post-close brief
    - cron: '30 15 * * 1-5'   # 21:00 IST weekdays -> US open brief
  workflow_dispatch:          # gives you a "Run workflow" button for testing

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Remember what was already sent
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run the bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ github.event.schedule == '*/15 * * * *' && 'breaking' || 'digest' }}
        run: python telegram_news_bot.py
